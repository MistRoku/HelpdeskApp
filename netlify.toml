# Frontend static deploy. Build output is frontend/build.
[build]
  base = "frontend"
  publish = "build"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so /tickets/42 deep links resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
